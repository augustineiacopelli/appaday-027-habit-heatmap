<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>027 · Habit Heatmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d110e;
      --surface: #141a15;
      --border: #1f2b20;
      --text: #d6e8d7;
      --text-dim: #5a7a5c;
      --text-muted: #2f4030;
      --cell-empty: #182019;
      --cell-hot: #6edc78;
      --accent: #6edc78;
      --accent-dim: rgba(110,220,120,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 0 20px 48px;
    }

    /* ── NAV ── */
    .app-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 6px;
    }

    .app-id { font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }
    .app-id a { color: var(--text-muted); text-decoration: none; }
    .app-id a:hover { color: var(--text-dim); }

    .gear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 34px; height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── HABIT TABS ── */
    .tabs-wrap {
      margin: 22px 0 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      padding: 7px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
    }

    .tab.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-add {
      padding: 7px 12px;
      border-radius: 100px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.18s;
      line-height: 1;
    }
    .tab-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── HERO ── */
    .hero { margin: 20px 0 0; }

    .habit-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 8vw, 40px);
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .month-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ── STATS ── */
    .stats-row {
      display: flex;
      gap: 20px;
      margin: 20px 0 24px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .stat { display: flex; flex-direction: column; gap: 3px; }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
    }

    .stat-value.flame::before { content: '🔥 '; font-size: 16px; }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .stat-divider { width: 1px; background: var(--border); align-self: stretch; }

    /* ── GRID ── */
    .grid-section { animation: fadeUp 0.4s ease both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .day-header {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
      padding: 3px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 5px;
      cursor: pointer;
      background: var(--cell-empty);
      border: 1px solid transparent;
      transition: transform 0.1s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex; align-items: center; justify-content: center;
    }

    .cell.filler  { background: transparent; cursor: default; border: none; pointer-events: none; }
    .cell.future  { opacity: 0.3; cursor: default; pointer-events: none; }

    .cell .day-num { font-size: 9px; color: var(--text-muted); pointer-events: none; transition: color 0.2s; }

    .cell.done { background: var(--cell-hot); }
    .cell.done .day-num { color: #0a1a0b; }

    .cell.today { border-color: var(--accent); }
    .cell.today:not(.done) { box-shadow: 0 0 0 1px var(--accent-dim); }

    .cell:not(.filler):not(.future):hover { transform: scale(1.12); border-color: var(--accent); z-index: 2; }
    .cell.done:hover { background: #4db857; }
    .cell:active:not(.filler):not(.future) { transform: scale(0.95); }



    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 36px;
      width: 100%; max-width: 480px;
      transform: translateY(20px);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; margin-bottom: 6px; color: var(--text);
    }

    .modal-subtitle {
      font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    /* Habit list in modal */
    .habit-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .habit-row {
      display: flex; align-items: center; gap: 8px;
    }

    .habit-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .habit-row input:focus { border-color: var(--accent); }
    .habit-row input::placeholder { color: var(--text-muted); }

    .habit-row input.active-habit { border-color: var(--accent); }

    .delete-btn {
      background: none;
      border: 1px solid #3a1a1a;
      color: #7a3333;
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
    }
    .delete-btn:hover { border-color: #c05050; color: #c05050; }

    .add-habit-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s;
      margin-bottom: 20px;
    }
    .add-habit-btn:hover { border-color: var(--accent); color: var(--accent); }
    .add-habit-btn:disabled { opacity: 0.3; cursor: default; }

    .modal-actions { display: flex; gap: 10px; }

    .btn {
      flex: 1; padding: 13px; border-radius: 8px; border: none;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #0a1a0b; }
    .btn-secondary { background: var(--border); color: var(--text-dim); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--accent); color: #0a1a0b;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
      padding: 10px 20px; border-radius: 100px;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app">
  <nav class="app-nav">
    <span class="app-id"><a href="https://augustineiacopelli.github.io/appaday">AppADay</a> · 027</span>
    <button class="gear-btn" id="gearBtn" aria-label="Settings">⚙️</button>
  </nav>

  <!-- Habit tabs -->
  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="hero">
    <h1 class="habit-name" id="habitName">—</h1>
    <p class="month-label" id="monthLabel">—</p>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-value flame" id="statStreak">0</span>
      <span class="stat-label">Streak</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">This Month</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="statBest">0</span>
      <span class="stat-label">Best Streak</span>
    </div>
  </div>

  <div class="grid-section" id="gridSection">
    <div class="day-headers" id="dayHeaders"></div>
    <div class="grid" id="grid"></div>

  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Habits</h2>
    <p class="modal-subtitle">Up to 5 habits · Tap a name to rename</p>
    <div class="habit-list" id="habitList"></div>
    <button class="add-habit-btn" id="addHabitBtn">+ Add Habit</button>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  const now = new Date();
  const YEAR  = now.getFullYear();
  const MONTH = now.getMonth();
  const TODAY = now.getDate();

  const HABITS_KEY = 'heatmap-habits-v2';
  const DATA_KEY   = (id) => `heatmap-data-${id}-${YEAR}-${String(MONTH+1).padStart(2,'0')}`;

  // ── State ──
  // habits: [{id, name}]
  // activeId: string
  // doneDays per habitId stored separately in localStorage

  function loadHabits() {
    try {
      const raw = localStorage.getItem(HABITS_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    // Default: one habit
    const id = uid();
    const habits = [{ id, name: 'Daily Habit' }];
    saveHabits(habits);
    return habits;
  }

  function saveHabits(habits) {
    localStorage.setItem(HABITS_KEY, JSON.stringify(habits));
  }

  function loadDays(id) {
    try {
      const raw = localStorage.getItem(DATA_KEY(id));
      if (raw) return new Set(JSON.parse(raw));
    } catch(e) {}
    return new Set();
  }

  function saveDays(id, set) {
    localStorage.setItem(DATA_KEY(id), JSON.stringify([...set]));
  }

  function uid() {
    return Math.random().toString(36).slice(2, 9);
  }

  let habits   = loadHabits();
  let activeId = habits[0].id;

  // ── Computed ──
  function activeDays() { return loadDays(activeId); }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstDow(y, m)    { return new Date(y, m, 1).getDay(); }

  function calcStreak(days) {
    let s = 0;
    for (let d = TODAY; d >= 1; d--) {
      if (days.has(d)) s++; else break;
    }
    return s;
  }

  function calcBest(days) {
    const total = daysInMonth(YEAR, MONTH);
    let best = 0, cur = 0;
    for (let d = 1; d <= total; d++) {
      if (days.has(d)) { cur++; best = Math.max(best, cur); } else cur = 0;
    }
    return best;
  }

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ── Render ──
  function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = '';
    habits.forEach(h => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (h.id === activeId ? ' active' : '');
      btn.textContent = h.name;
      btn.addEventListener('click', () => {
        activeId = h.id;
        renderTabs();
        renderMain();
      });
      container.appendChild(btn);
    });
  }

  function renderMain() {
    const habit = habits.find(h => h.id === activeId);
    if (!habit) return;
    const days = loadDays(activeId);

    document.getElementById('habitName').textContent = habit.name;
    document.getElementById('monthLabel').textContent = `${MONTHS[MONTH]} ${YEAR}`;
    document.getElementById('statStreak').textContent = calcStreak(days);
    document.getElementById('statTotal').textContent  = days.size;
    document.getElementById('statBest').textContent   = calcBest(days);

    // Restart animation
    const gs = document.getElementById('gridSection');
    gs.style.animation = 'none';
    gs.offsetHeight; // reflow
    gs.style.animation = '';

    // Day headers
    const headers = document.getElementById('dayHeaders');
    headers.innerHTML = '';
    DAYS_SHORT.forEach(d => {
      const el = document.createElement('div');
      el.className = 'day-header';
      el.textContent = d.charAt(0);
      headers.appendChild(el);
    });

    // Grid
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const total = daysInMonth(YEAR, MONTH);
    const start = firstDow(YEAR, MONTH);

    for (let i = 0; i < start; i++) {
      const el = document.createElement('div');
      el.className = 'cell filler';
      grid.appendChild(el);
    }

    for (let d = 1; d <= total; d++) {
      const el = document.createElement('div');
      el.className = 'cell';
      if (d === TODAY) el.classList.add('today');
      if (d > TODAY)  el.classList.add('future');
      if (days.has(d)) el.classList.add('done');

      const num = document.createElement('span');
      num.className = 'day-num';
      num.textContent = d;
      el.appendChild(num);

      if (d <= TODAY) {
        el.addEventListener('click', () => toggleDay(d));
      }
      grid.appendChild(el);
    }
  }

  function toggleDay(day) {
    const days = loadDays(activeId);
    if (days.has(day)) {
      days.delete(day);
      showToast(`Day ${day} unmarked`);
    } else {
      days.add(day);
      const streak = calcStreak(days);
      showToast(streak > 1 ? `🔥 ${streak} day streak!` : '✓ Logged');
    }
    saveDays(activeId, days);
    renderMain();
  }

  // ── Modal ──
  let draftHabits = [];

  function openModal() {
    // Deep copy current habits for editing
    draftHabits = habits.map(h => ({ ...h }));
    renderModalList();
    document.getElementById('modalOverlay').classList.add('open');
  }

  function renderModalList() {
    const list = document.getElementById('habitList');
    list.innerHTML = '';
    draftHabits.forEach((h, i) => {
      const row = document.createElement('div');
      row.className = 'habit-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 30;
      input.value = h.name;
      input.placeholder = 'Habit name';
      if (h.id === activeId) input.classList.add('active-habit');
      input.addEventListener('input', () => { draftHabits[i].name = input.value; });

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.title = 'Remove habit';
      del.addEventListener('click', () => {
        if (draftHabits.length === 1) {
          showToast('Need at least one habit');
          return;
        }
        if (confirm(`Remove "${draftHabits[i].name}"? Its data will be deleted.`)) {
          // Delete stored data
          localStorage.removeItem(DATA_KEY(draftHabits[i].id));
          draftHabits.splice(i, 1);
          renderModalList();
        }
      });

      row.appendChild(input);
      row.appendChild(del);
      list.appendChild(row);
    });

    document.getElementById('addHabitBtn').disabled = draftHabits.length >= 5;
  }

  document.getElementById('gearBtn').addEventListener('click', openModal);

  document.getElementById('addHabitBtn').addEventListener('click', () => {
    if (draftHabits.length >= 5) return;
    draftHabits.push({ id: uid(), name: '' });
    renderModalList();
    // Focus the new input
    const inputs = document.querySelectorAll('.habit-row input');
    inputs[inputs.length - 1].focus();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    // Filter out blank names
    const valid = draftHabits.filter(h => h.name.trim());
    if (valid.length === 0) {
      showToast('Add at least one habit name');
      return;
    }
    habits = valid.map(h => ({ ...h, name: h.name.trim() }));
    saveHabits(habits);
    // If activeId was removed, switch to first
    if (!habits.find(h => h.id === activeId)) activeId = habits[0].id;
    document.getElementById('modalOverlay').classList.remove('open');
    renderTabs();
    renderMain();
    showToast('Saved');
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('open');
  });

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  });

  // ── Init ──
  renderTabs();
  renderMain();
</script>
</body>
</html>
